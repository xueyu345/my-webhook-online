<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Webhook</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e30;--line:#293950;--txt:#eaf1fb;--muted:#9aabc1;--green:#6ee7b7;--blue:#8bbcff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,sans-serif}.top{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#0e1727;position:sticky;top:0}.brand{font-size:18px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}h1{font-size:25px;margin:5px 0}h2{font-size:16px;margin:0 0 13px}.muted{color:var(--muted)}input,textarea,select{background:#0a1423;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px;width:100%;font:inherit}textarea{min-height:75px}button{border:1px solid var(--line);background:#1a2a40;color:var(--txt);padding:9px 13px;border-radius:8px;font:inherit;cursor:pointer}.primary{background:var(--green);color:#06271d;border-color:var(--green);font-weight:750}.danger{color:#ffb8c4}.hidden{display:none!important}.auth{max-width:430px;margin:8vh auto}.field{margin:10px 0}.field label{display:block;color:var(--muted);margin-bottom:5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#0c1829;padding:14px;border-radius:10px}.metric b{display:block;font-size:24px}.item{border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0}.url{font:12px ui-monospace,monospace;color:var(--blue);overflow-wrap:anywhere;margin:8px 0}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#091321;padding:12px;border-radius:8px;max-height:260px;overflow:auto}.note{background:#2b271a;color:#f4dc91;border:1px solid #5e512a;border-radius:9px;padding:11px;font-size:12px}@media(max-width:650px){.wrap{padding:14px}.cards{grid-template-columns:1fr 1fr}.top{padding:13px}}
</style></head><body><header class="top"><div class="brand">↗ My Webhook</div><div id="who" class="muted"></div></header>
<div id="auth" class="wrap auth"><div class="panel"><h1>欢迎使用 My Webhook</h1><p class="muted">注册或登录你的私人工作区</p><div class="field"><label>邮箱</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>密码（至少 10 位）</label><input id="password" type="password" autocomplete="current-password"></div><div class="row"><button class="primary grow" onclick="authAction('login')">登录</button><button class="grow" onclick="authAction('register')">注册</button></div><p id="authMsg" class="muted"></p></div></div>
<div id="app" class="wrap hidden"><div class="row"><div class="grow"><h1>控制台</h1><div class="muted">创建接收地址，查看真实 HTTP 请求</div></div><button onclick="logout()">退出登录</button></div>
<div class="cards"><div class="metric"><span class="muted">Endpoints</span><b id="countEp">0</b></div><div class="metric"><span class="muted">请求记录</span><b id="countLog">0</b></div><div class="metric"><span class="muted">工作区</span><b>已连接</b></div></div>
<div class="panel"><h2>创建 Webhook Endpoint</h2><div class="row"><input id="epName" class="grow" placeholder="例如：Shopify 测试" style="min-width:180px"><button class="primary" onclick="createEndpoint()">＋ 创建地址</button></div></div>
<div class="panel"><div class="row"><h2 class="grow">我的接收地址</h2><button onclick="loadAll()">刷新</button></div><div id="endpoints"></div></div>
<div class="panel"><div class="row"><h2 class="grow">最近请求</h2><button onclick="clearLogs()">清空日志</button></div><div class="table"><table><thead><tr><th>方法</th><th>Endpoint</th><th>来源 IP</th><th>时间</th><th>详情</th></tr></thead><tbody id="logs"></tbody></table></div><div id="detail"></div></div>
<div class="note">公网使用前请部署 HTTPS、设置强 JWT_SECRET、限制请求体大小并配置备份与速率限制。此版本不提供 ngrok 原生隧道；可在 VPS 前端接入 Cloudflare Tunnel。</div></div>
<script>
const API='';let token=localStorage.getItem('mwh_token')||'',endpoints=[],logs=[];
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});let d=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(d.detail||'请求失败');return d}
function message(id,s){document.getElementById(id).textContent=s}
async function authAction(mode){message('authMsg','处理中…');try{let d=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});let j=await d.json();if(!d.ok)throw Error(j.detail||'认证失败');token=j.token;localStorage.setItem('mwh_token',token);await boot()}catch(e){message('authMsg',e.message)}}
async function boot(){try{let me=await api('/api/me');document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=me.email;await loadAll()}catch(e){logout(false)}}
function logout(show=true){token='';localStorage.removeItem('mwh_token');document.getElementById('app').classList.add('hidden');document.getElementById('auth').classList.remove('hidden');document.getElementById('who').textContent=''}
async function loadAll(){try{[endpoints,logs]=await Promise.all([api('/api/endpoints'),api('/api/logs')]);render()}catch(e){alert(e.message)}}
async function createEndpoint(){let name=document.getElementById('epName').value.trim();if(!name)return alert('请填写名称');try{await api('/api/endpoints',{method:'POST',body:JSON.stringify({name,response_code:200,response_body:'{"ok":true}',active:true})});epName.value='';await loadAll()}catch(e){alert(e.message)}}
function render(){countEp.textContent=endpoints.length;countLog.textContent=logs.length;document.getElementById('endpoints').innerHTML=endpoints.map(e=>`<div class="item"><div class="row"><b class="grow">${safe(e.name)}</b><span class="muted">${e.active?'启用':'停用'}</span></div><div class="url">${location.origin}/webhook/${safe(e.token)}</div><div class="row"><button onclick="copy('${location.origin}/webhook/${e.token}')">复制地址</button><button onclick="editEp(${e.id})">设置响应</button><button class="danger" onclick="deleteEp(${e.id})">删除</button></div></div>`).join('')||'<p class="muted">暂无地址</p>';
document.getElementById('logs').innerHTML=logs.map(l=>`<tr><td>${safe(l.method)}</td><td>${safe(l.endpoint_name)}</td><td>${safe(l.client_ip)}</td><td>${new Date(l.created_at).toLocaleString()}</td><td><button onclick="detail(${l.id})">查看</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">还没有收到请求</td></tr>'}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copy(s){navigator.clipboard?.writeText(s).then(()=>alert('已复制')).catch(()=>prompt('复制地址',s))}
async function editEp(id){let e=endpoints.find(x=>x.id===id);let code=prompt('响应状态码',e.response_code);if(code===null)return;let body=prompt('响应 Body',e.response_body);if(body===null)return;try{await api('/api/endpoints/'+id,{method:'PATCH',body:JSON.stringify({name:e.name,response_code:Number(code),response_body:body,active:e.active})});await loadAll()}catch(err){alert(err.message)}}
async function deleteEp(id){if(!confirm('确定删除？相关日志也会删除。'))return;await api('/api/endpoints/'+id,{method:'DELETE'});await loadAll()}
function detail(id){let l=logs.find(x=>x.id===id);document.getElementById('detail').innerHTML=`<h2>请求详情</h2><p class="muted">${safe(l.method)} ${safe(l.path)}?${safe(l.query_string)}</p><b>Headers</b><pre>${safe(JSON.stringify(l.headers,null,2))}</pre><b>Body</b><pre>${safe(l.body)}</pre>`}
async function clearLogs(){if(!confirm('清空当前账号全部日志？'))return;await api('/api/logs',{method:'DELETE'});await loadAll()}
if(token)boot();
</script></body></html>
